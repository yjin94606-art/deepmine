<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152733"><title>Deepmine</title><link rel="icon" href="mine-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="mine-ui.css">
<link rel="stylesheet" href="treasure.css"><script defer src="treasure.js"></script>
<script defer src="evidence-core.js"></script><script defer src="demo-records.js"></script><script defer src="daily-artifact-core.js"></script><script defer src="expedition-world.js"></script><script defer src="work-findings.js"></script><script defer src="drill-art.js"></script><script defer src="expedition-art.js"></script><script defer src="cavern-geology.js"></script><script defer src="cavern-lighting.js"></script><script defer src="expedition-life.js"></script><script defer src="output-art.js"></script><script defer src="descent-scene.js"></script><script defer src="expedition-audio.js"></script><script defer src="item-intro.js"></script><script defer src="item-story.js"></script><script defer src="source-replay.js"></script><script defer src="visual-readings.js"></script><script defer src="work-readings.js"></script><script defer src="work-subjects.js"></script><script defer src="work-objects.js"></script><script defer src="work-imprints.js"></script><script defer src="work-sprites.js"></script><script defer src="work-sketch.js"></script><script defer src="work-narration.js"></script><script defer src="i18n.js"></script><script defer src="gallery-ledger.js"></script><script defer src="gallery-ui.js"></script><script defer src="gallery-art.js"></script><script defer src="expedition-app.js"></script>
<link rel="stylesheet" href="daily-depth.css"><script defer src="daily-depth-art.js"></script><script defer src="daily-depth.js"></script>
</head><body>
<main class="mine-stage"><canvas id="expeditionCanvas" tabindex="0"></canvas></main>
<header class="hud topbar"><div class="identity"><h1 data-i18n="brand">Deepmine</h1><p><a id="projectName" data-title="switchProject"></a></p></div><div class="toolbar"><button id="sourceButton" aria-describedby="sourceStatus" data-title="sources"><span aria-hidden="true">◌</span> <span class="source-indicator" id="sourceStatus"></span></button><button id="settingsButton" data-title="settings"><span class="icon" aria-hidden="true">⚙</span></button></div></header>
<section class="hud depth-hud"><div class="depth-value"><strong id="depthValue">0</strong><span data-i18n="unit">m</span></div><p id="earnedValue"></p></section>
<div class="hud view-caption"><span id="viewDate"></span><p id="viewUsage"></p></div>
<aside class="hud history-rail"><span data-i18n="history">Time</span><span id="timelineHelp" class="sr-only" data-i18n="timelineKeys"></span><nav id="timeline" role="toolbar" aria-orientation="vertical" aria-describedby="timelineHelp" data-label="history"></nav></aside>
<div class="hud mine-actions"><button id="digButton" disabled data-i18n="mineAction">Dig</button><small id="pendingLabel"></small></div>
<nav class="hud view-tools"><button id="followButton" data-title="follow"><span aria-hidden="true">↓</span></button><button id="zoomOutButton" data-title="zoomOut"><span aria-hidden="true">−</span></button><button id="zoomInButton" data-title="zoomIn"><span aria-hidden="true">+</span></button><label id="paceControl" class="pace-control" hidden><span data-i18n="paceLabel">Speed</span><select id="paceSelect" data-title="paceHint"><option value="normal">1×</option><option value="brisk">1.5×</option><option value="fast">3×</option></select></label></nav>
<footer class="hud status-line"><span class="scroll-hint" data-i18n="scrollHint">Scroll through history · Hover to read about a find</span><span class="touch-hint" id="touchHint" hidden data-i18n="tapFind">Tap a find</span><span id="freshness"></span><button id="refreshButton" data-title="refresh" aria-label="Refresh">↻</button></footer>
<div id="demoNotice" class="hud demo-notice" hidden><span data-i18n="fictional">Fictional demo · Not your records</span><button id="exitDemoButton" data-i18n="exitDemo">Return to real records</button></div>
<div id="connectionCard" class="hud empty-state" hidden><p id="connectionMessage" role="status"></p><div id="connectionActions" hidden><button id="connectButton" type="button"></button><button id="demoButton" data-i18n="demo">View fictional demo</button></div></div>
<nav id="galleryArrange" class="hud gallery-arrange" hidden><span></span><div><button data-place="left">←</button><button data-place="up">↑</button><button data-place="down">↓</button><button data-place="right">→</button><button data-place="done"></button></div><small data-gallery-status role="status"></small></nav>
<div id="hoverCard" class="hover-card" role="tooltip" hidden></div>
<dialog id="detailDialog" class="floating-panel" aria-labelledby="detailTitle"><div class="panel-head"><h2 id="detailTitle"></h2><button data-close="detailDialog" data-title="close" aria-label="Close">×</button></div><div id="detailPlayer" hidden></div><div id="detailBody"></div><section id="galleryDetail" class="gallery-tools" hidden><p></p><div><button type="button" data-gallery="move"></button><button type="button" data-gallery="sell"></button><button type="button" data-gallery="discard"></button><button type="button" data-gallery="keep" hidden></button><button type="button" data-gallery="confirm" hidden></button></div><small data-gallery-status role="status"></small></section></dialog>
<dialog id="sourceDialog" class="floating-panel" aria-labelledby="sourceTitle"><div class="panel-head"><h2 id="sourceTitle" data-i18n="sources">Sources</h2><button data-close="sourceDialog" data-title="close" aria-label="Close">×</button></div><div id="sourceBody"></div></dialog>
<dialog id="settingsDialog" class="floating-panel" aria-labelledby="settingsTitle"><div class="panel-head"><h2 id="settingsTitle" data-i18n="settings">Settings</h2><button data-close="settingsDialog" data-title="close" aria-label="Close">×</button></div><div class="source-actions"><button type="button" id="settingsProjectButton" data-i18n="switchProject">Switch project</button></div><label><span data-i18n="language">Language</span><select id="localeSelect"><option value="auto" data-i18n="autoLanguage">Automatic</option><option value="zh-CN">中文</option><option value="en">English</option><option value="ja">日本語</option></select></label><label><span data-i18n="mineSound"></span><input id="soundToggle" type="checkbox"></label><label><span data-i18n="animation">Pause scene</span><input id="pauseToggle" type="checkbox"></label><p class="subtle" data-i18n="reduced">Respect system reduced motion</p><section id="narrationSettings"><label><span data-i18n="narrationToggle"></span><select id="narrationMode" disabled aria-describedby="narrationHint"><option value="off" data-i18n="narrationOff"></option><option value="work" data-i18n="narrationWorkMode"></option><option value="process" data-i18n="narrationProcessMode"></option></select></label><p id="narrationHint" class="subtle" data-i18n="narrationInfo"></p><small id="narrationSettingsStatus" role="status"></small></section><section class="optional-news"><label><span data-i18n="mineNews"></span><input type="checkbox" id="newsToggle" aria-describedby="newsHint"></label><p class="subtle" id="newsHint" data-i18n="mineNewsHint"></p><div id="newsBody" hidden></div></section><details id="galleryShop" class="save-details"><summary></summary><p></p><div><button type="button" data-style="lamp"></button><button type="button" data-style="tile"></button></div><small role="status" data-gallery-status></small></details><details class="save-details"><summary data-i18n="mineSave">Mining and saves</summary><p data-i18n="excavationNote"></p><p data-i18n="settlementNote"></p><p class="subtle" id="settledLabel"></p><h3 data-i18n="history">Time</h3><p class="subtle" id="historyRange"></p><p class="subtle" id="timezoneLabel"></p><p class="subtle" data-i18n="dataTitles"></p></details><div class="source-actions"><button id="settingsDemoButton" data-i18n="demo">View fictional demo</button></div></dialog>
<dialog id="sourcePlayback" class="source-playback" aria-labelledby="playbackLabel">
<canvas id="playbackCanvas" tabindex="-1"></canvas>
<div class="playback-top"><span id="playbackLabel"></span><button type="button" id="leavePlayback" data-i18n="close">Close</button></div>
<div class="playback-bottom"><strong id="playbackDepth"></strong><button type="button" id="seePlaybackWork" data-i18n="seeWork">View work</button></div>
</dialog>
<dialog id="discoveryStage" class="discovery-stage" aria-labelledby="stageEyebrow">
<div class="stage-inner">
  <small id="stageEyebrow"></small>
  <div class="stage-art"><canvas id="stageCanvas" width="168" height="112" aria-hidden="true"></canvas></div>
  <div class="stage-copy"><div id="stageContent"><div class="stage-record"><button type="button" data-stage-record></button><p></p></div></div><nav id="stageWorks" class="work-pages stage-work-pages" hidden></nav><div class="stage-controls"><button id="stageContinue" type="button" autofocus data-i18n="continueDig">Continue digging</button><a id="chooseAfterFind" href="/" data-i18n="chooseProject" hidden>Choose my project</a></div></div>
</div>
</dialog>
<span id="discoveryAnnouncement" class="sr-only" aria-live="polite"></span>
<div class="treasure-dock"><button id="treasureChest" type="button" hidden aria-haspopup="dialog" aria-controls="treasureDialog"><canvas width="28" height="24" id="chestArt" aria-hidden="true"></canvas></button></div>
<dialog id="treasureDialog" class="floating-panel" aria-labelledby="treasureTitle"><div class="panel-head"><h2 id="treasureTitle">Map archive</h2><button id="treasureClose" type="button" aria-label="Close">×</button></div><div id="treasureBody"></div><button type="button" id="treasureRanking">Personal survey log</button></dialog>
<span id="treasureAnnounce" class="sr-only" aria-live="polite"></span>
<dialog id="depthBoard" class="floating-panel depth-board" aria-labelledby="boardTitle">
  <div class="panel-head"><h2 id="boardTitle"></h2><button type="button" id="boardClose">×</button></div>
  <section id="surveyWorkday" hidden aria-labelledby="workdayHeading">
    <div class="workday-head"><h3 id="workdayHeading"></h3><small id="workdayDate"></small></div>
    <dl class="workday-values"><div><dt id="workdayTokenLabel"></dt><dd id="workdayTokens"></dd></div><div><dt id="workdayFileLabel"></dt><dd id="workdayFiles"></dd></div><div><dt id="workdayMeterLabel"></dt><dd id="workdayMeters"></dd></div></dl>
    <ul id="workdayTitles" hidden></ul>
  </section>
  <div class="survey-reading"><canvas id="surveyBadge" width="32" height="36" aria-hidden="true"></canvas><div><small id="surveyDay"></small><strong id="surveyMeters">—</strong><p id="surveyStamp"></p></div></div>
  <h3 id="boardHeading"></h3>
  <figure class="survey-section"><canvas id="boardSurveyScene" width="288" height="106" aria-hidden="true"></canvas><figcaption id="surveyMilestone"></figcaption></figure>
  <p id="surveyPrevious" hidden></p>
  <details id="stampBook" hidden><summary id="stampBookTitle"></summary><ul id="stampDays"></ul></details>
  <p id="boardState" role="status"></p>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div><noscript><p class="noscript">JavaScript is required.</p></noscript>
</body></html>
