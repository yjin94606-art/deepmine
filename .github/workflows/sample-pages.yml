name: Forward former site links to GitHub

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sample-pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sample-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare redirects for previously shared URLs
        run: |
          mkdir -p site/watch/zh
          repository_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0;url=$repository_url">
          <link rel="canonical" href="$repository_url">
          <title>Deepmine on GitHub</title>
          <a href="$repository_url">Deepmine on GitHub · 前往 GitHub 仓库</a>
          </html>
          HTML
          cp site/index.html site/watch/index.html
          cp site/index.html site/watch/zh/index.html
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish redirects
        id: deployment
        uses: actions/deploy-pages@v4
